<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Portal · DotCom by Arshees</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#6B1E3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arshees">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%236B1E3A'/%3E%3Ctext x='19' y='27' text-anchor='middle' font-family='Georgia,serif' font-size='21' fill='%23fff'%3Ea%3C/text%3E%3Ccircle cx='27.5' cy='25.5' r='2.2' fill='%23C9A24A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#6B1E3A;--wine2:#8a2a4d;--gold:#C9A24A;--cream:#FBF7F2;--ink:#22181c;--mute:#7a6b70;--line:#eadfd8;--ok:#2f7d4f;--warn:#b7791f;--bad:#b4363c;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--wine)}
button{font:inherit;cursor:pointer}
header{background:var(--wine);color:#fff}
.top{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px;padding:14px 18px}
.brand{font-family:Fraunces,Georgia,serif;font-size:20px;line-height:1.1}
.brand small{display:block;font:500 11px Inter,sans-serif;letter-spacing:1.6px;text-transform:uppercase;opacity:.75}
.sp{flex:1}
.out{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px}
nav{max-width:760px;margin:auto;display:flex;gap:4px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:0;color:#f3e6ea;padding:7px 13px;border-radius:999px;white-space:nowrap;font-weight:500}
nav button.on{background:#fff;color:var(--wine)}
main{max-width:760px;margin:auto;padding:22px 18px 70px}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:28px;margin:0 0 6px}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:22px;margin:0 0 12px}
h3{font-size:12.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);margin:26px 0 10px;font-weight:600}
p.lead{color:var(--mute);margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--wine);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:#fff;color:var(--wine);border:1px solid var(--line)}
.btn.gold{background:#f7c6d9;color:#3a1020}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#f3ece8;color:var(--mute);white-space:nowrap}
.chip.g{background:#e3f2e8;color:var(--ok)}.chip.y{background:#fbf0d9;color:var(--warn)}.chip.r{background:#fbe3e3;color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-family:Fraunces,Georgia,serif;font-size:24px;color:var(--wine);font-weight:600}
.kpi span{color:var(--mute);font-size:13px}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li .m{flex:1;min-width:0}
.li .m small{display:block;color:var(--mute);font-size:13px}
label.f{display:block;margin:12px 0}
label.f>span{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:5px}
input,select,textarea{font:inherit;width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #e9c9d6;border-color:var(--wine2)}
.code{font-size:28px;letter-spacing:10px;text-align:center;font-weight:600}
.note{background:#fff8ea;border:1px solid #f1dfb5;border-radius:12px;padding:12px 14px;font-size:14px}
.ok{background:#eaf6ee;border:1px solid #cfe8d7;border-radius:12px;padding:12px 14px;font-size:14px;color:#1f5c38}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:20px}
.login{max-width:420px;margin:30px auto}
.seal{display:flex;justify-content:center;margin-bottom:14px}
.qr{display:flex;justify-content:center;margin:12px 0}
.qr svg{background:#fff;border-radius:12px;border:1px solid var(--line);padding:6px}
.amt{font-family:Fraunces,Georgia,serif;font-size:30px;color:var(--wine);text-align:center}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.files span{font-size:12px;background:#f3ece8;border-radius:8px;padding:4px 8px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
td.n{text-align:right;white-space:nowrap;padding-left:10px}
tr.t td{font-weight:600;color:var(--wine)}
.promo{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.promo .ic{width:40px;height:40px;border-radius:10px;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.promo .m{flex:1;font-size:14px}.promo .m b{display:block;font-size:15px}
.dot{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--gold);color:#2a1d10;font-size:11px;font-weight:700;text-align:center;margin-left:4px;padding:0 4px}
.notice{padding:11px 0;border-top:1px solid var(--line);font-size:15px}.notice:first-child{border-top:0;padding-top:0}.notice small{display:block;color:var(--mute);font-size:12.5px}
.ov{position:fixed;inset:0;background:rgba(34,24,28,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--cream);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 20px 26px;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:22px}}
.sheet .appic{width:64px;height:64px;border-radius:16px;margin:0 auto 10px;display:block}
.sheet h2{text-align:center;margin:0 0 6px}.sheet p{text-align:center;color:var(--mute);margin:0 0 14px;font-size:15px}
.steps{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin:0 0 14px;font-size:15px}
.steps div{padding:9px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}.steps div:first-child{border-top:0}
.steps b.n{width:24px;height:24px;border-radius:50%;background:var(--wine);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.track{display:flex;gap:4px;margin:4px 0 18px}.track div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.track div i{display:block;height:6px;border-radius:3px;background:#eadfd8;margin-bottom:6px}.track div.done i{background:var(--wine)}.track div.now i{background:var(--gold)}.track div.now{color:var(--ink);font-weight:600}
.plan{display:block;background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;cursor:pointer}
.plan.on{border-color:var(--wine);box-shadow:0 4px 18px rgba(107,30,58,.10)}
.plan .pr{font-family:Fraunces,Georgia,serif;font-size:24px;color:var(--wine)}.plan ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:#4a3b40}
.plan input{width:auto;margin-right:8px;accent-color:var(--wine)}
.opt{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:15px}.opt input{width:auto;accent-color:var(--wine)}
.sigpad{background:#fff;border:1px dashed #cdbfb8;border-radius:12px;width:100%;height:150px;touch-action:none;display:block}
.hero{background:linear-gradient(135deg,#6B1E3A,#8a2a4d);color:#fff;border-radius:var(--r);padding:22px 20px;margin-bottom:14px}.hero h1{color:#fff}.hero p{color:#f3e6ea;margin:0}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:4px 16px 14px;margin-bottom:14px}.sec>h3{margin:14px 0 2px}
.drcard{border:1px solid var(--line);border-radius:14px;padding:4px 14px 10px;margin:12px 0;background:#fdfbf9}.drcard b.t{display:block;margin-top:10px;color:var(--wine)}
.picked{display:flex;flex-direction:column;gap:6px;margin-top:8px}.picked div{display:flex;gap:8px;align-items:center;font-size:13px;background:#f6f0ec;border-radius:10px;padding:6px 8px}.picked div span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.picked input{padding:7px 9px;font-size:13px}.picked button{border:0;background:none;color:var(--bad);font-size:18px;padding:0 4px}
.price-note{font-size:13px;color:var(--mute);margin:-4px 0 8px}
.link{background:none;border:0;color:var(--wine);font-weight:600;padding:0;text-decoration:underline}
@media (display-mode: standalone){footer{padding-bottom:40px}}
footer{text-align:center;color:var(--mute);font-size:12.5px;padding:10px 18px 30px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
.btn.ghost .spin{border-color:#e7d6dc;border-top-color:var(--wine)}
@keyframes s{to{transform:rotate(1turn)}}
</style>
</head>
<body>
<header>
  <div class="top">
    <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#fff"/><circle cx="20" cy="20" r="16.5" fill="#6B1E3A"/><text x="19" y="27" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="21" fill="#fff">a</text><circle cx="27.5" cy="25.5" r="2.2" fill="#C9A24A"/></svg>
    <div class="brand" id="brandName">DotCom by Arshees<small>Client portal</small></div>
    <div class="sp"></div>
    <button class="out" id="logout" hidden>Log out</button>
  </div>
  <nav id="nav" hidden></nav>
</header>
<main id="app"></main>
<footer>Need help? <a href="mailto:support@arshees.com">support@arshees.com</a> · +971 58 657 6586</footer>
<script src="qrcode.js"></script>
<script>
/* Backend: the Apps Script web app URL (set once it is deployed). */
const API = 'https://script.google.com/macros/s/AKfycbyEMBsgKbDOlVGA1TFpYV1nYTVLM7lrhZ-9tIhc3KSVD53hjYVnjt0_-r0UUYbQIG9PMw/exec';
const KEY = 'arsheesPortal';

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = iso => { if (!iso) return '—'; const d = new Date(String(iso).length === 10 ? iso + 'T00:00:00' : iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}); };
function money(n, c) { if (n === '' || n == null || isNaN(+n)) return '—'; c = c || 'INR'; try { return new Intl.NumberFormat(c === 'INR' ? 'en-IN' : 'en-US', {style:'currency', currency:c, minimumFractionDigits:(+n % 1 ? 2 : 0), maximumFractionDigits:2}).format(+n); } catch (e) { return c + ' ' + n; } }
function chip(s) { if (!s) return ''; const g = ['Paid','Signed','Accepted','Live','Handed over','Active','Done'], y = ['Sent','Part paid','Awaiting signature','Building','Due','Open'], r = ['Overdue','Expired','Cancelled']; return `<span class="chip ${g.includes(s)?'g':y.includes(s)?'y':r.includes(s)?'r':''}">${esc(s)}</span>`; }
const store = { get(){ try { return localStorage.getItem(KEY) || ''; } catch(e) { return S.mem || ''; } }, set(v){ S.mem = v; try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch(e) {} } };

const S = { app:{}, seen:0, view:'login', step:'email', email:'', data:null, tab:'home', busy:false, mem:'', msg:{} };

async function call(action, body) {
  if (!API) throw { error:'not_ready' };
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action, ...body }) });
  const j = await r.json();
  if (!j.ok) throw j;
  return j;
}
const ERR = { pay_unavailable:'Online payment is not available right now. Please pay by UPI below and upload the screenshot.', pay_failed:'Could not start the payment. Please try again, or pay by UPI below.', bad_payment:'We could not verify this payment. If money was deducted, it will be confirmed automatically within 15 minutes — or contact support@arshees.com.', bad_amount:'The amount looks wrong. Please contact support@arshees.com.', phone_taken:'This mobile number is already registered with another email. Please log in with that email, or contact support@arshees.com.', bad_register:'Please enter your name and a valid phone number.', not_ready:'This step is not ready yet. Please refresh.', bad_plan:'Please choose a plan.', bad_sign:'Please type your name, sign in the box and tick the box to accept.', bad_email:'Please enter a valid email address.', bad_code:'That code is not right. Please check and try again.', expired:'That code has expired. Ask for a new one.', too_many:'Too many tries. Please wait a while and try again.', wait:'A code was just sent. Please wait a minute before asking again.', no_access:'This email does not have portal access. Please contact us.', logged_out:'Please log in again.', not_ready:'The portal is being set up. Please try again soon.', server_error:'Something went wrong on our side. Please try again.' };
const errText = e => (e && e.error === 'new_too_soon') ? `You can request a fresh sample after ${e.date}. Until then you can continue with your previous request.` : ERR[e && e.error] || 'Could not connect. Check your internet and try again.';

/* ---------- login ---------- */
function viewLogin() {
  if (S.step === 'email') return `<div class="login"><div class="card">
    <h1>Welcome</h1><p class="lead">Log in to see your website, documents and payments. We'll email you a 6-digit code — no password needed.</p>
    <form id="fEmail"><label class="f"><span>Your email</span><input id="email" type="email" autocomplete="email" inputmode="email" required value="${esc(S.email)}" placeholder="you@example.com"></label>
    <button class="btn block" id="bSend">Send me a code</button><div class="err" id="err"></div></form></div>
    <div class="card" style="text-align:center"><b style="font-size:17px">New to DotCom by Arshees?</b><p style="color:var(--mute);margin:4px 0 12px;font-size:14px">Get your own online clinic website. Send us your details and we'll prepare a free sample for you.</p><button class="btn gold block" data-act="register">Get my online clinic website</button></div></div>`;
  if (S.step === 'register') return `<div class="login"><div class="card">
    <h1>Get your online clinic</h1><p class="lead">Create your free account. We'll email you a 6-digit code to confirm your email.</p>
    <form id="fReg"><label class="f"><span>Your name</span><input id="rName" required autocomplete="name" placeholder="Dr Firstname Lastname" value="${esc(S.regName || '')}"></label>
    <label class="f"><span>Email</span><input id="email" type="email" autocomplete="email" inputmode="email" required value="${esc(S.email)}" placeholder="you@example.com"></label>
    <label class="f"><span>Phone / WhatsApp</span><input id="rPhone" type="tel" autocomplete="tel" inputmode="tel" required placeholder="+91 98xxxxxxxx" value="${esc(S.regPhone || '')}"></label>
    <button class="btn block" id="bReg">Continue</button><div class="err" id="err"></div></form>
    <p style="text-align:center;margin:12px 0 0"><button class="link" data-act="change">I already have an account</button></p></div></div>`;
  return `<div class="login"><div class="card">
    <h1>Check your email</h1><p class="lead">We sent a 6-digit code to <b>${esc(S.email)}</b>. It works for 10 minutes. Check spam if you don't see it.</p>
    <form id="fCode"><label class="f"><span>Login code</span><input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>
    <button class="btn block" id="bVerify">Log in</button><div class="err" id="err"></div></form>
    <div class="row" style="justify-content:space-between;margin-top:6px"><button class="btn ghost" data-act="change">Use another email</button><button class="btn ghost" data-act="resend">Send a new code</button></div></div></div>`;
}
async function sendCode() {
  const email = $('#email') ? $('#email').value.trim() : S.email; if (!email) return;
  S.email = email; setBusy('#bSend', true);
  try { await call('requestCode', { email }); S.step = 'code'; render(); setTimeout(() => $('#code') && $('#code').focus(), 50); }
  catch (e) { showErr(errText(e)); if (e.error === 'wait') { S.step = 'code'; render(); showErr(errText(e)); } }
  setBusy('#bSend', false);
}
async function register() {
  const email = $('#email').value.trim(), name = $('#rName').value.trim(), phone = $('#rPhone').value.trim();
  S.email = email; S.regName = name; S.regPhone = phone; setBusy('#bReg', true);
  try { await call('requestCode', { email, register:true, name, phone }); S.step = 'code'; render(); setTimeout(() => $('#code') && $('#code').focus(), 50); }
  catch (e) { showErr(errText(e)); if (e.error === 'wait') { S.step = 'code'; render(); showErr(errText(e)); } }
  setBusy('#bReg', false);
}
async function verify() {
  const code = $('#code').value.replace(/\D/g, ''); if (code.length !== 6) { showErr('Enter the 6 digits from the email.'); return; }
  setBusy('#bVerify', true);
  try { const j = await call('verifyCode', { email:S.email, code }); store.set(j.token); S.data = j.data; S.app = j.app || {}; S.view = 'app'; maybeInstall(); initPush(); S.tab = 'home'; render(); }
  catch (e) { showErr(errText(e)); }
  setBusy('#bVerify', false);
}

/* ---------- app ---------- */
const TABS_ALL = [['home','Overview'],['updates','Updates'],['docs','Documents'],['pay','Pay'],['details','My details'],['support','Support']];
const ONB = () => (S.app && S.app.onboarding) || null;
const onboarding = () => { const o = ONB(); return o && ['registered','submitted','offer','accepted','expired','resume'].includes(o.stage); };
const TABS_GET = () => onboarding() ? [['home','My website'],['updates','Updates'],['support','Support']] : TABS_ALL;
function D() { return S.data || {}; }
function viewHome() {
  const d = D(), bal = (d.balance || []).filter(b => +b.amt > 0);
  const pending = (d.docs || []).filter(x => x.signLink && !x.signedAt);
  return `${promos()}<h1>Hello${d.name ? ', ' + esc(d.name) : ''}</h1><p class="lead">${esc(d.business || d.venture || '')}</p>
  <div class="kpis">
    <div class="kpi"><b>${bal.length ? bal.map(b => money(b.amt, b.cur)).join(' + ') : '₹0'}</b><span>Balance due</span></div>
    <div class="kpi"><b>${pending.length}</b><span>Document${pending.length === 1 ? '' : 's'} to sign</span></div>
    <div class="kpi"><b>${(d.payments || []).length}</b><span>Payment${(d.payments || []).length === 1 ? '' : 's'} received</span></div>
  </div>
  ${pending.length || bal.length ? `<h3>To do</h3><div class="card">${pending.map(x => `<div class="li"><div class="m"><b>Sign ${esc(x.title || x.no)}</b><small>${esc(x.no)} · ${fmtD(x.date)}</small></div><a class="btn gold" href="${esc(x.signLink)}" target="_blank" rel="noopener">Read & sign</a></div>`).join('')}${bal.length ? `<div class="li"><div class="m"><b>Pay ${bal.map(b => money(b.amt, b.cur)).join(' + ')}</b><small>By UPI, in a few taps</small></div><button class="btn gold" data-tab="pay">Pay now</button></div>` : ''}</div>` : ''}
  <h3>Your website${(d.sites || []).length > 1 ? 's' : ''}</h3>
  ${(d.sites || []).length ? (d.sites).map(s => `<div class="card"><div class="row"><b style="flex:1">${esc(s.name)}</b>${chip(s.status)}</div>
    ${s.liveUrl ? `<div style="margin-top:4px"><a href="${esc(/^https?:/i.test(s.liveUrl) ? s.liveUrl : 'https://' + s.liveUrl)}" target="_blank" rel="noopener">${esc(s.liveUrl)}</a></div>` : ''}
    <table>${s.handover ? `<tr><td>Handed over</td><td class="n">${fmtD(s.handover)}</td></tr>` : ''}${s.renewal ? `<tr><td>Next yearly renewal</td><td class="n">${fmtD(s.renewal)}</td></tr>` : ''}${s.renewalFee ? `<tr><td>Yearly renewal fee</td><td class="n">${money(s.renewalFee, s.cur)}</td></tr>` : ''}${s.domain ? `<tr><td>Domain</td><td class="n">${esc(s.domain)}</td></tr>` : ''}</table></div>`).join('') : '<div class="card" style="color:var(--mute)">Your website details will appear here.</div>'}

  c.width = r.width * dpr; c.height = r.height * dpr; const x = c.getContext('2d'); x.scale(dpr, dpr); x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#1d2a5a';
  Object.assign(SIG, { c, x, dirty:false, down:false });
  const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { SIG.down = true; SIG.dirty = true; c.setPointerCapture(e.pointerId); const [a, b] = pos(e); x.beginPath(); x.moveTo(a, b); };
  c.onpointermove = e => { if (!SIG.down) return; const [a, b] = pos(e); x.lineTo(a, b); x.stroke(); };
  c.onpointerup = c.onpointercancel = () => { SIG.down = false; };
}
function sigData() { if (!SIG.c || !SIG.dirty) return ''; const o = document.createElement('canvas'), w = 480; o.width = w; o.height = Math.round(w * SIG.c.height / SIG.c.width); const g = o.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, o.width, o.height); g.drawImage(SIG.c, 0, 0, o.width, o.height); return o.toDataURL('image/png'); }
async function acceptOffer() {
  const name = $('#aName').value.trim(), sig = sigData(), agree = $('#aAgree').checked; S.accName = name;
  if (!name || !sig || !agree) { showErr(ERR.bad_sign); return; }
  setBusy('#bAcc', true);
  try { const j = await call('submit', { token:store.get(), type:'accept', payload:{ plan:S.selPlan, payMode:S.payMode || 'advance', signedName:name, signature:sig, agree:true, ua:navigator.userAgent } }); S.app.onboarding = j.onboarding; S.msg.home = 'Signed! Now complete the payment below.'; render(); scrollTo(0, 0); }
  catch (e) { if (e.error === 'logged_out') return logout(true); showErr(errText(e)); }
  setBusy('#bAcc', false);
}

/* ---------- app: install, notifications, updates ---------- */
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/i.test(navigator.userAgent);
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S.view === 'app') render(); });
addEventListener('appinstalled', () => { installEvt = null; S.installed = true; render(); });
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function unread() { const n = (S.app.notices || []); const seen = lsGet(KEY + ':seen') || ''; return n.filter(x => x.at > seen).length; }
function pushState() { if (!S.app.pushAppId) return 'off'; if (!('Notification' in window) || !('serviceWorker' in navigator)) return isIOS() && !isStandalone() ? 'ios-install' : 'unsupported'; return Notification.permission; }
function promos() {
  let h = '';
  if (!isStandalone()) {
    if (installEvt) h += `<div class="promo"><div class="ic">a</div><div class="m"><b>Install the Arshees app</b>Get notified when we update your account.</div><button class="btn" data-act="install">Install</button></div>`;
    else if (isIOS()) h += `<div class="promo"><div class="ic">a</div><div class="m"><b>Install the Arshees app</b>For notifications: tap <b style="display:inline">Share</b> ⬆︎ then <b style="display:inline">Add to Home Screen</b>.</div></div>`;
  }
  const ps = pushState();
  if (ps === 'default') h += `<div class="promo"><div class="ic">🔔</div><div class="m"><b>Turn on notifications</b>Get an alert when we update your website, documents or payments.</div><button class="btn" data-act="push">Turn on</button></div>`;
  else if (ps === 'ios-install') h += `<div class="promo"><div class="ic">🔔</div><div class="m"><b>Want notifications?</b>On iPhone, add the app to your Home Screen first, then open it from there.</div></div>`;
  return h;
}
function viewUpdates() {
  const n = S.app.notices || []; lsSet(KEY + ':seen', n.length ? n[0].at : new Date().toISOString()); setTimeout(() => { const nav = $('#nav'); if (nav) nav.querySelectorAll('.dot').forEach(d => d.remove()); }, 50);
  const ps = pushState();
  return `<h2>Updates</h2><p class="lead">Everything new on your account. We also email you each update.</p>
  ${promos()}
  <div class="card">${n.length ? n.map(x => `<div class="notice">${esc(x.text)}<small>${fmtD(x.at)}${' · ' + new Date(x.at).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' })}</small></div>`).join('') : '<span style="color:var(--mute)">No updates yet. When we add a document, record a payment or change your website, it will show here.</span>'}</div>
  <h3>Notifications</h3><div class="card" style="font-size:14px">${ps === 'granted' ? '✓ Notifications are on for this device.' : ps === 'denied' ? 'Notifications are blocked for this site. You can allow them in your browser or phone settings.' : ps === 'default' ? '<button class="btn" data-act="push">Turn on notifications</button>' : ps === 'ios-install' ? 'On iPhone, add the app to your Home Screen (Share → Add to Home Screen), open it from there, then turn on notifications here.' : (ps === 'off' ? 'Email updates are on. App notifications will be switched on soon.' : 'Email updates are on. App notifications are not available on this device.')}</div>`;
}
function maybeInstall() {
  if (isStandalone()) return;
  const last = +(lsGet(KEY + ':installLater') || 0);
  if (Date.now() - last < 2 * 864e5) return; // asked in the last 2 days
  S.showInstall = true;
}
function installSheet() {
  if (!S.showInstall || S.view !== 'app' || isStandalone()) return '';
  let body;
  if (S.installed) body = `<h2>Installed ✓</h2><p>Open <b>Arshees</b> from your home screen, then tap <b>Turn on notifications</b>.</p><button class="btn block" data-act="later">Got it</button>`;
  else if (installEvt) body = `<h2>Install the Arshees app</h2><p>Get a notification whenever we update your website, documents or payments. It takes one tap and uses almost no space.</p><button class="btn block" data-act="install">Install app</button><button class="btn ghost block" style="margin-top:8px" data-act="later">Maybe later</button>`;
  else if (isIOS()) body = `<h2>Install the Arshees app</h2><p>To receive notifications on iPhone, add the app to your Home Screen:</p>
    <div class="steps"><div><b class="n">1</b><span>Tap the <b>Share</b> button <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f6fde" stroke-width="2" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 12v8h14v-8"/></svg> at the bottom of Safari</span></div><div><b class="n">2</b><span>Choose <b>Add to Home Screen</b></span></div><div><b class="n">3</b><span>Open <b>Arshees</b> from your Home Screen and tap <b>Turn on notifications</b></span></div></div>
    <button class="btn block" data-act="later">OK</button>`;
  else body = `<h2>Install the Arshees app</h2><p>Get a notification whenever we update your account.</p>
    <div class="steps"><div><b class="n">1</b><span>Open your browser menu <b>⋮</b></span></div><div><b class="n">2</b><span>Tap <b>Install app</b> or <b>Add to Home screen</b></span></div><div><b class="n">3</b><span>Open <b>Arshees</b> and tap <b>Turn on notifications</b></span></div></div>
    <button class="btn block" data-act="later">OK</button>`;
  return `<div class="ov" data-act="ovbg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Install the Arshees app"><img class="appic" src="icon-192.png" alt="">${body}</div></div>`;
}
let pushReady = null;
function initPush() {
  if (!S.app.pushAppId || pushReady || !('serviceWorker' in navigator)) return;
  pushReady = new Promise(ok => {
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async OS => {
      try { await OS.init({ appId:S.app.pushAppId, safari_web_id:'web.onesignal.auto.5b1b15a7-d107-41ff-b02e-c379c8847bd2', serviceWorkerPath:'portal/sw.js', serviceWorkerParam:{ scope:'/portal/' }, notifyButton:{ enable:false }, autoResubscribe:true });
        await OS.login(S.app.pushId); OS.Notifications.addEventListener('permissionChange', () => render()); } catch (e) { console.warn('push', e); }
      ok(OS);
    });
    const sc = document.createElement('script'); sc.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js'; sc.defer = true; document.head.appendChild(sc);
  });
}
async function askPush() {
  initPush(); if (!pushReady) return;
  try { const OS = await pushReady; await OS.Notifications.requestPermission(); if (OS.User && OS.User.PushSubscription) await OS.User.PushSubscription.optIn(); } catch (e) { try { await Notification.requestPermission(); } catch (_) {} }
  render();
}
if ('serviceWorker' in navigator) addEventListener('load', () => { navigator.serviceWorker.register('sw.js', { scope:'./' }).catch(() => {}); });

/* ---------- files ---------- */
function loadRzp() { return window.Razorpay ? Promise.resolve() : new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://checkout.razorpay.com/v1/checkout.js'; sc.onload = ok; sc.onerror = () => no({ error:'pay_unavailable' }); document.head.appendChild(sc); }); }
async function payRzp(btn) {
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Opening secure payment…'; showErr('');
  const reset = () => { btn.disabled = false; btn.textContent = label; };
  try {
    await loadRzp();
    const o = await call('payOrder', { token:store.get() });
    const rz = new Razorpay({ key:o.key, order_id:o.order_id, amount:o.amount, currency:o.currency, name:o.name, description:'Online clinic website', prefill:o.prefill, theme:{ color:'#6b1d3a' },
      handler: async r => {
        btn.textContent = 'Confirming payment…';
        try { const j = await call('payVerify', { token:store.get(), razorpay_payment_id:r.razorpay_payment_id, razorpay_order_id:r.razorpay_order_id, razorpay_signature:r.razorpay_signature }); S.app.onboarding = j.onboarding; render(); scrollTo(0, 0); }
        catch (e) { if (e.error === 'logged_out') return logout(true); reset(); showErr(errText(e)); }
      },
      modal:{ ondismiss: () => { reset(); showErr('Payment cancelled. You can try again whenever you are ready.'); } } });
    rz.on('payment.failed', f => { reset(); showErr('Payment failed' + (f && f.error && f.error.description ? ': ' + f.error.description : '') + '. No money was taken — please try again.'); });
    rz.open();
  } catch (e) { if (e.error === 'logged_out') return logout(true); reset(); showErr(errText(e)); }
}
async function readFile(f) {
  if (/^image\/(jpeg|png|webp|heic|heif)/i.test(f.type) && f.size > 350000) {
    try { const img = await createImageBitmap(f); const sc = Math.min(1, 1800 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const b = await new Promise(ok => c.toBlob(ok, 'image/jpeg', .85)); if (b) f = new File([b], f.name.replace(/\.\w+$/, '') + '.jpg', { type:'image/jpeg' }); } catch (e) {}
  }
  if (f.size > 8 * 1048576) throw { error:'file_big', name:f.name };
  const b64 = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(f); });
  return { name:f.name, mime:f.type || 'application/octet-stream', b64 };
}
async function filesFrom(sel) { const el = $(sel); if (!el || !el.files.length) return []; const out = []; for (const f of [...el.files].slice(0, 12)) out.push(await readFile(f)); return out; }
async function submit(btn, type, payload, fileSel, done) {
  setBusy(btn, true);
  try { const files = await filesFrom(fileSel); const j = await call('submit', { token:store.get(), type, payload, files }); if (j.onboarding) S.app.onboarding = j.onboarding; done(); }
  catch (e) { if (e.error === 'logged_out') return logout(true); showErr(e.error === 'file_big' ? `"${e.name}" is too large (max 8 MB). Please send a smaller file.` : errText(e)); }
  setBusy(btn, false);
}

/* ---------- render ---------- */
function render() {
  const app = S.view === 'app';
  $('#logout').hidden = !app; $('#nav').hidden = !app;
  if (app) $('#nav').innerHTML = TABS_GET().map(([k, l]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${l}${k === 'updates' && unread() ? `<span class="dot">${unread()}</span>` : ''}</button>`).join('');
  let h = '';
  if (S.view === 'loading') h = `<div class="login" style="text-align:center;color:var(--mute)">Loading your portal…</div>`;
  else if (!app) h = viewLogin();
  else { if (!TABS_GET().some(t => t[0] === S.tab)) S.tab = 'home'; const ok = S.msg[S.tab] ? `<div class="ok" style="margin-bottom:14px">${S.msg[S.tab]}</div>` : '';
    h = ok + ({ home:() => (ONB() && ONB().stage !== 'live' && ONB().stage !== 'building' ? viewOnboard() : '') + (onboarding() ? '' : viewHome()), updates:viewUpdates, docs:viewDocs, pay:viewPay, details:viewDetails, support:viewSupport }[S.tab])(); }
  $('#app').innerHTML = h + installSheet();
  SIG.c = null; initSig();
  if (S.view === 'login' && S.step === 'email' && !API) showErr(ERR.not_ready);
}
function showErr(m) { const e = $('#err'); if (e) e.textContent = m || ''; }
function setBusy(sel, on) { const b = $(sel); if (!b) return; b.disabled = on; if (on) { b.dataset.t = b.innerHTML; b.innerHTML = '<span class="spin"></span>'; } else if (b.dataset.t) b.innerHTML = b.dataset.t; }
async function logout(expired) { try { if (pushReady) (await pushReady).logout(); } catch (e) {} const t = store.get(); store.set(''); S.data = null; S.view = 'login'; S.step = 'email'; S.msg = {}; render(); if (expired) showErr(ERR.logged_out); if (t && !expired) try { await call('logout', { token:t }); } catch (e) {} }

document.addEventListener('submit', e => {
  e.preventDefault(); const id = e.target.id;
  if (id === 'fEmail') sendCode();
  else if (id === 'fReg') register();
  else if (id === 'fAcc') acceptOffer();
  else if (id === 'fOnb') submitOnb(e.target);
  else if (id === 'fOPay') { const o = ONB() || {}; submit('#bOPay', 'payment', { amount:$('#pAmt').value, ref:$('#pRef').value.trim(), forLabel:(o.plan || '') + ' plan ' + (o.payMode || ''), forNo:(o.offer && o.offer.quoteNo) || '' }, '#pFile', () => { S.msg.home = ''; render(); scrollTo(0, 0); }); }
  else if (id === 'fCode') verify();
  else if (id === 'fPay') { const p = (D().pay || [])[S.payIx || 0]; submit('#bPay', 'payment', { amount:$('#pAmt').value, ref:$('#pRef').value.trim(), forLabel:p ? p.label : '', forNo:p ? p.forNo : '' }, '#pFile', () => { S.msg.pay = 'Thank you! We received your screenshot and will confirm the payment shortly.'; render(); scrollTo(0, 0); }); }
  else if (id === 'fDet') { const fd = Object.fromEntries(new FormData(e.target).entries()); S.msg.draft = fd; submit('#bDet', 'details', fd, '#dFiles', () => { S.data.details = Object.assign({}, S.data.details || {}, fd); S.msg.draft = null; S.msg.details = 'Thank you! Your details were sent. We will update your website soon.'; render(); scrollTo(0, 0); }); }
  else if (id === 'fSup') submit('#bSup', 'support', { topic:$('#sType').value, message:$('#sMsg').value.trim() }, '#sFile', () => { S.msg.support = 'Sent! We reply within 24 hours by email.'; render(); scrollTo(0, 0); });
});
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-act],[data-pay],[data-copyupi],[data-unpick],[data-resume]'); if (!t) return;
  const d = t.dataset;
  if (d.act === 'rzp') { payRzp(t); return; }
  if (d.unpick) { const [k, i] = d.unpick.split(':'); (PICK[k] || []).splice(+i, 1); const f = $('#fOnb'); if (f) S.msg.ondraft = collectOnb(f); render(); return; }
  if (d.resume) { t.disabled = true; try { const j = await call('submit', { token:store.get(), type:'resume', payload:{ choice:d.resume } }); S.app.onboarding = j.onboarding; S.msg.ondraft = null; render(); scrollTo(0, 0); } catch (err) { if (err.error === 'logged_out') return logout(true); t.disabled = false; showErr(errText(err)); } return; }
  if (d.tab) { S.tab = d.tab; Object.keys(S.msg).forEach(k => { if (k !== 'draft') delete S.msg[k]; }); render(); scrollTo(0, 0); }
  else if (d.pay) { S.payIx = +d.pay; S.tab = 'pay'; render(); scrollTo(0, 0); }
  else if (d.act === 'change') { S.step = 'email'; render(); }
  else if (d.act === 'register') { S.step = 'register'; render(); }
  else if (d.act === 'clearsig') { if (SIG.x) { SIG.x.clearRect(0, 0, SIG.c.width, SIG.c.height); SIG.dirty = false; } }
  else if (d.act === 'install') { if (installEvt) { const ev = installEvt; ev.prompt(); try { const c = await ev.userChoice; if (c && c.outcome === 'accepted') S.installed = true; else { S.showInstall = false; lsSet(KEY + ':installLater', Date.now()); } } catch (_) {} installEvt = null; render(); } }
  else if (d.act === 'later') { S.showInstall = false; if (!S.installed) lsSet(KEY + ':installLater', Date.now()); render(); }
  else if (d.act === 'ovbg') { if (e.target === t) { S.showInstall = false; lsSet(KEY + ':installLater', Date.now()); render(); } }
  else if (d.act === 'push') { askPush(); }
  else if (d.act === 'resend') { sendCode(); }
  else if (d.copyupi) { try { await navigator.clipboard.writeText(d.copyupi); t.textContent = 'Copied ✓'; } catch (_) { t.textContent = d.copyupi; } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.pick) { const k = t.dataset.pick, list = [...t.files].map(f => ({ file:f, caption:'' })); PICK[k] = t.dataset.single ? list.slice(0, 1) : (PICK[k] || []).concat(list); const f = $('#fOnb'); if (f) S.msg.ondraft = collectOnb(f); render(); return; }
  if (t.id === 'docCount') { const f = $('#fOnb'); S.msg.ondraft = collectOnb(f); render(); return; }
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.cap) { const [k, i] = t.dataset.cap.split(':'); if (PICK[k] && PICK[k][+i]) PICK[k][+i].caption = t.value; } });
document.addEventListener('change', e => { if (e.target.id === 'paySel') { S.payIx = +e.target.value; render(); } else if (e.target.name === 'plan') { S.selPlan = e.target.value; render(); } else if (e.target.name === 'paymode') { S.payMode = e.target.value; render(); } });
$('#logout').onclick = () => logout(false);

(async () => {
  const tok = store.get();
  if (!tok || !API) { S.view = 'login'; render(); return; }
  S.view = 'loading'; render();
  try { const j = await call('me', { token:tok }); S.data = j.data; S.app = j.app || {}; S.view = 'app'; maybeInstall(); render(); initPush(); }
  catch (e) { if (e.error === 'logged_out') store.set(''); S.view = 'login'; render(); if (e.error !== 'logged_out') showErr(errText(e)); }
})();
</script>
</body>
</html>
